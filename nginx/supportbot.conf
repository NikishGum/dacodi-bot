# ──────────────────────────────────────────────────────────────────────────
# Nginx site for the Telegram support bot.
#  - Terminates TLS, redirects HTTP → HTTPS, sets HSTS, hides version.
#  - Proxies only the two webhook paths to the bot on localhost.
#  - Restricts /telegram/webhook to Telegram IP ranges and /zoho/webhook to
#    Zoho IP ranges; everything else is rejected.
#  - Rate limits both endpoints.
#
# Replace bot.example.com and the certificate paths. VERIFY the Zoho IP ranges
# against Zoho's current published list before going live.
# ──────────────────────────────────────────────────────────────────────────

# Rate-limit zones (shared memory keyed by client address).
limit_req_zone $binary_remote_addr zone=telegram_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=zoho_zone:10m rate=20r/s;

# Telegram official webhook source ranges (stable).
geo $telegram_allowed {
    default 0;
    149.154.160.0/20 1;
    91.108.4.0/22    1;
}

# Zoho webhook source ranges. VERIFY/UPDATE from Zoho documentation for your DC.
geo $zoho_allowed {
    default 0;
    136.143.184.0/24 1;
    136.143.188.0/24 1;
    185.230.212.0/22 1;
    89.207.16.0/22   1;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Reasonable body cap for webhook payloads.
    client_max_body_size 2m;

    location = /telegram/webhook {
        if ($telegram_allowed = 0) { return 403; }
        limit_req zone=telegram_zone burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location = /zoho/webhook {
        if ($zoho_allowed = 0) { return 403; }
        limit_req zone=zoho_zone burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Everything else is not exposed.
    location / {
        return 404;
    }
}
