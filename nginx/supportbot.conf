# ──────────────────────────────────────────────────────────────────────────
# Nginx site for the Telegram support bot.
#  - Terminates TLS, redirects HTTP → HTTPS, sets HSTS, hides version.
#  - Proxies only the Telegram webhook path to the bot on localhost.
#  - Restricts /telegram/webhook to Telegram IP ranges; everything else is
#    rejected. The bot pulls operator replies from Zoho by polling, so there is
#    no inbound /zoho/webhook route. /admin/unbind is loopback-only and must NOT
#    be exposed here.
#  - Rate limits the endpoint.
#
# Replace bot.example.com and the certificate paths.
# ──────────────────────────────────────────────────────────────────────────

# Rate-limit zone (shared memory keyed by client address).
limit_req_zone $binary_remote_addr zone=telegram_zone:10m rate=30r/s;

# Telegram official webhook source ranges (stable).
geo $telegram_allowed {
    default 0;
    149.154.160.0/20 1;
    91.108.4.0/22    1;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Reasonable body cap for webhook payloads.
    client_max_body_size 2m;

    location = /telegram/webhook {
        if ($telegram_allowed = 0) { return 403; }
        limit_req zone=telegram_zone burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # Everything else is not exposed.
    location / {
        return 404;
    }
}
